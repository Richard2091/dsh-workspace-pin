# dsh-workspace-pin — bundle patch
#
# 插入一个宿主条目。浏览器半边由 package.json 的 `dsh.client` 声明自动挂载，
# 由 /plugins/dsh-workspace-pin/client.js 提供，不需要在 patch 里单独声明入口。
#
# 宿主半边注册 GET|POST /plugins/dsh-workspace-pin/state，把置顶集合持久化到
# <DSH_HOME>/storages/dsh-workspace-pin/state.json（跨浏览器、清缓存不丢）；
# 浏览器 localStorage 只作为首帧缓存与旧数据迁移源。工作区显示顺序仍写宿主的
# 工作区 registry（与官方拖拽排序同一份）。停用插件本身就是总开关。
#
# 可选配置 stateFile：把状态文件指到别处（默认见上）。
#   config:
#     stateFile: 'D:\dsh-data\workspace-pin.json'

- insert:
    - id: workspace-pin
      name: 'dsh-workspace-pin'
      config: {}
